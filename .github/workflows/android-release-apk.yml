# DURUSTU NOT: Bu dosya bilincli olarak .github/workflows/ DIŞINDA.
# Arena ajaninin GitHub App izni `workflows` kapsamini icermiyor; GitHub boyle bir
# dizine yazilan her commit'i push sirasinda reddediyor. Aktif hale getirmek icin:
#
#     git mv .github/ci/android-release-apk.yml .github/workflows/android-release-apk.yml
#     git push
#
# Repoda duran eski surum (.github/workflows/android-release-apk.yml) yanlis job id'si,
# imzasiz derleme, test/SDK adimi eksikleri ve yazim hatalari iceriyordu; asagidaki
# surum bunlari duzeltir.
name: Build Release APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # local.properties depoya alinmadigi icin Gradle ANDROID_HOME'u kullanir.
      # Eksik SDK bilesenleri varsa kurulur; runner imajinda zaten varsa adim bos gecer.
      - name: Ensure Android SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null || true
            "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" || true
          else
            echo "sdkmanager bulunamadi; runner'daki onyuklu SDK kullanilacak"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint (fatal checks, incl. MissingClass)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.XSEC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xsecurity-release.jks"
            echo "XSEC_KEYSTORE=$RUNNER_TEMP/xsecurity-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore hazirlandi."
          else
            echo "XSEC_KEYSTORE_BASE64 tanimli degil: release APK imzasiz uretilecek."
          fi

      - name: Build release APK
        env:
          XSEC_KEYSTORE_PASSWORD: ${{ secrets.XSEC_KEYSTORE_PASSWORD }}
          XSEC_KEY_ALIAS: ${{ secrets.XSEC_KEY_ALIAS }}
          XSEC_KEY_PASSWORD: ${{ secrets.XSEC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
