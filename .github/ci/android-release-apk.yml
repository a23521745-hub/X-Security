name: Build & Release OTA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null || true
            "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" || true
          else
            echo "sdkmanager bulunamadi; runner'daki onyuklu SDK kullanilacak"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Calculate Version
        id: version
        run: |
          set -euo pipefail
          GRADLE_FILE="app/build.gradle.kts"
          
          # build.gradle.kts icinden versionCode ve versionName okuma
          CURRENT_CODE=$(grep -E 'versionCode\s*=' "$GRADLE_FILE" | grep -oE '[0-9]+' || echo "1")
          CURRENT_NAME=$(grep -E 'versionName\s*=' "$GRADLE_FILE" | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.0.0")
          
          NEXT_CODE=$((CURRENT_CODE + 1))
          
          echo "current=$CURRENT_CODE" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_CODE}" >> "$GITHUB_OUTPUT"
          echo "gradle_file=$GRADLE_FILE" >> "$GITHUB_OUTPUT"
          echo "version_name=$CURRENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Update versionCode in build.gradle.kts
        env:
          CURRENT_VER: ${{ steps.version.outputs.current }}
          NEXT_VER: ${{ steps.version.outputs.next }}
          GRADLE_FILE: ${{ steps.version.outputs.gradle_file }}
        run: |
          set -euo pipefail
          sed -i -E "s/(versionCode\s*=\s*)$CURRENT_VER/\1$NEXT_VER/" "$GRADLE_FILE"

      - name: Run Unit Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android Lint Checks
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Prepare Release Keystore (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.XSEC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xsecurity-release.jks"
            echo "XSEC_KEYSTORE=$RUNNER_TEMP/xsecurity-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore hazirlandi."
          else
            echo "XSEC_KEYSTORE_BASE64 tanimli degil: release APK imzasiz uretilecek."
          fi

      - name: Build Release APK
        env:
          XSEC_KEYSTORE_PASSWORD: ${{ secrets.XSEC_KEYSTORE_PASSWORD }}
          XSEC_KEY_ALIAS: ${{ secrets.XSEC_KEY_ALIAS }}
          XSEC_KEY_PASSWORD: ${{ secrets.XSEC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare Artifacts & Generate + Sign update.json
        env:
          NEXT_VER: ${{ steps.version.outputs.next }}
          VER_NAME: ${{ steps.version.outputs.version_name }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          # OTA manifestini imzalamak icin kullanilan RSA-2048 PRIVATE anahtari
          # (base64 kodlu PEM). Uygulama imzasiz manifesti KABUL ETMEZ; bu secret
          # yoksa yayinlanan update.json yalnizca bilgilendirme amaclidir.
          OTA_SIGNING_KEY_B64: ${{ secrets.XSEC_OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" X-Security.apk
          
          SHA256=$(sha256sum X-Security.apk | awk '{print $1}')
          
          cat << EOF > update.json
          {
            "versionCode": ${NEXT_VER},
            "versionName": "${VER_NAME}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/X-Security.apk",
            "apkSha256": "${SHA256}",
            "apkSizeBytes": $(stat -c%s X-Security.apk),
            "minSdk": 26,
            "forceUpdate": false,
            "changelog": "X-Security otomatik OTA güncellemesi (v${NEXT_VER})",
            "releaseNotes": "X-Security Otomatik OTA Güncellemesi (v${NEXT_VER})"
          }
          EOF
          
          if [ -n "$OTA_SIGNING_KEY_B64" ]; then
            printf '%s' "$OTA_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/ota-signing-private.pem"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/ota-signing-private.pem" \
              -out update.json.sig update.json
            rm -f "$RUNNER_TEMP/ota-signing-private.pem"
            echo "update.json imzalandi (update.json.sig uretildi)."
          else
            echo "UYARI: XSEC_OTA_SIGNING_KEY tanimli degil; update.json IMZASIZ." >&2
            echo "Uygulama bu manifesti reddeder (imza dogrulamasi basarisi olur)." >&2
          fi

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "X-Security OTA Build v${{ steps.version.outputs.next }}"
          make_latest: true
          files: |
            X-Security.apk
            update.json
            update.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Commit and Push Updated Files (build.gradle.kts & update.json)
        env:
          GRADLE_FILE: ${{ steps.version.outputs.gradle_file }}
          NEXT_VER: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "$GRADLE_FILE" update.json
          git commit -m "chore(release): Auto-build X-Security v$NEXT_VER [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload Test/Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
